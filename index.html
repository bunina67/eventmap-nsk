
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EventMap — мероприятия Новосибирска</title>

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #202238;
      background: #f5f6fb;
    }

    header {
      height: 72px;
      background: white;
      display: flex;
      align-items: center;
      gap: 22px;
      padding: 0 24px;
      border-bottom: 1px solid #e9e9f2;
    }

    .logo {
      color: #7047eb;
      font-size: 23px;
      font-weight: 800;
      white-space: nowrap;
    }

    .city { color: #77788b; }

    #search {
      margin-left: auto;
      width: min(360px, 45%);
      padding: 12px 16px;
      border: 1px solid #dedfeb;
      border-radius: 22px;
      font-size: 14px;
    }

    .layout {
      display: grid;
      grid-template-columns: 370px minmax(0, 1fr);
      height: calc(100vh - 72px);
      min-height: 500px;
    }

    aside {
      overflow-y: auto;
      padding: 20px;
      background: white;
      border-right: 1px solid #e9e9f2;
    }

    h1 { font-size: 23px; margin: 0 0 8px; }
    h2 { font-size: 16px; margin-top: 24px; }
    .muted { color: #77788b; font-size: 13px; }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }

    button, select {
      cursor: pointer;
      border: 1px solid #e0deed;
      border-radius: 12px;
      background: white;
      padding: 10px 12px;
      color: #34344b;
    }

    button.active, button:hover {
      background: #eee8ff;
      border-color: #b9a6ff;
      color: #6038d5;
    }

    select { width: 100%; margin-top: 8px; }

    #eventList {
      display: grid;
      gap: 12px;
      margin-top: 14px;
    }

    .event-card {
      padding: 15px;
      border: 1px solid #e8e7f0;
      border-radius: 16px;
      background: white;
    }

    .event-card h3 {
      font-size: 16px;
      margin: 9px 0;
    }

    .event-card p {
      color: #77788b;
      font-size: 13px;
      line-height: 1.5;
      margin: 5px 0;
    }

    .tag {
      display: inline-block;
      background: #f0ebff;
      color: #6941df;
      padding: 5px 9px;
      border-radius: 9px;
      font-size: 12px;
    }

    .price {
      font-weight: bold;
      margin-top: 12px;
    }

    .ticket {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 14px;
      border-radius: 10px;
      background: #7047eb;
      color: white;
      text-decoration: none;
      font-size: 13px;
    }

    #map { width: 100%; height: 100%; }

    .leaflet-popup-content { line-height: 1.5; }

    @media (max-width: 760px) {
      header { padding: 12px; height: auto; flex-wrap: wrap; }
      .city { display: none; }
      #search { width: 100%; margin: 0; }
      .layout {
        height: auto;
        min-height: 0;
        grid-template-columns: 1fr;
      }
      aside { overflow: visible; }
      #map { height: 55vh; min-height: 350px; }
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">📍 EventMap</div>
    <div class="city">Новосибирск</div>
    <input id="search" type="search"
      placeholder="Найти мероприятие или место...">
  </header>

  <main class="layout">
    <aside>
      <h1>Куда пойдём?</h1>
      <div class="muted">Мероприятия твоего города в одном месте</div>

      <div class="chips" id="categories">
        <button class="active" data-category="Все">Все</button>
        <button data-category="Концерт">🎵 Концерты</button>
        <button data-category="Выставка">🎨 Выставки</button>
        <button data-category="Спорт">⚽ Спорт</button>
        <button data-category="Вечеринка">🎉 Вечеринки</button>
        <button data-category="Квартирник">🎸 Квартирники</button>
      </div>

      <h2>Когда?</h2>
      <select id="timeFilter">
        <option value="all">В любое время</option>
        <option value="today">Сегодня</option>
        <option value="weekend">В эти выходные</option>
      </select>

      <h2>События на карте</h2>
      <div id="count" class="muted"></div>
      <div id="eventList"></div>
    </aside>

    <section aria-label="Карта мероприятий Новосибирска">
      <div id="map"></div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const events = [
      {
        id: 1,
        title: "Концерт молодых исполнителей",
        category: "Концерт",
        date: nextDate(1, 19),
        address: "Михайловская набережная",
        price: 500,
        coords: [55.0302, 82.9204],
        url: ""
      },
      {
        id: 2,
        title: "Выставка современного искусства",
        category: "Выставка",
        date: nextDate(2, 12),
        address: "Центр Новосибирска",
        price: 300,
        coords: [55.0415, 82.9234],
        url: ""
      },
      {
        id: 3,
        title: "Спортивная встреча в парке",
        category: "Спорт",
        date: nextDate(3, 10),
        address: "Центральный парк",
        price: 0,
        coords: [55.0380, 82.9270],
        url: ""
      },
      {
        id: 4,
        title: "Вечер музыки и общения",
        category: "Вечеринка",
        date: nextDate(4, 20),
        address: "Октябрьский район",
        price: 400,
        coords: [55.0180, 82.9500],
        url: ""
      },
      {
        id: 5,
        title: "Акустический квартирник",
        category: "Квартирник",
        date: nextDate(5, 18),
        address: "Район станции метро Площадь Ленина",
        price: 250,
        coords: [55.0300, 82.9200],
        url: ""
      }
    ];

    // Демоданные: даты назначаются относительно текущей недели.
    function nextDate(daysAhead, hour) {
      const d = new Date();
      d.setDate(d.getDate() + daysAhead);
      d.setHours(hour, 0, 0, 0);
      return d;
    }

    const map = L.map("map").setView([55.0302, 82.9204], 12);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
      maxZoom: 19
    }).addTo(map);

    const colors = {
      "Концерт": "#8757ed",
      "Выставка": "#e59b35",
      "Спорт": "#269b73",
      "Вечеринка": "#e45f91",
      "Квартирник": "#4286d9"
    };

    const markerLayer = L.layerGroup().addTo(map);
    let selectedCategory = "Все";

    const search = document.getElementById("search");
    const timeFilter = document.getElementById("timeFilter");
    const eventList = document.getElementById("eventList");

    function formatDate(date) {
      return date.toLocaleString("ru-RU", {
        day: "numeric",
        month: "long",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function safeText(value) {
      return String(value).replace(/[&<>"']/g, ch => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[ch]);
    }

    function filteredEvents() {
      const q = search.value.trim().toLowerCase();
      const now = new Date();

      return events.filter(event => {
        const matchesCategory =
          selectedCategory === "Все" ||
          event.category === selectedCategory;

        const matchesSearch =
          (event.title + " " + event.address + " " + event.category)
            .toLowerCase().includes(q);

        let matchesTime = true;

        if (timeFilter.value === "today") {
          matchesTime = event.date.toDateString() === now.toDateString();
        }

        if (timeFilter.value === "weekend") {
          const day = now.getDay();
          const daysToSaturday = (6 - day + 7) % 7;
          const saturday = new Date(now);
          saturday.setDate(now.getDate() + daysToSaturday);
          saturday.setHours(0, 0, 0, 0);

          const mondayAfter = new Date(saturday);
          mondayAfter.setDate(saturday.getDate() + 2);

          matchesTime = event.date >= saturday &&
                        event.date < mondayAfter;
        }

        return matchesCategory && matchesSearch && matchesTime;
      });
    }

    function render() {
      const visible = filteredEvents();
      eventList.replaceChildren();
      markerLayer.clearLayers();

      document.getElementById("count").textContent =
        "Найдено мероприятий: " + visible.length;

      visible.forEach(event => {
        const color = colors[event.category] || "#7047eb";

        const marker = L.circleMarker(event.coords, {
          radius: 9,
          color: "#ffffff",
          weight: 2,
          fillColor: color,
          fillOpacity: 1
        }).addTo(markerLayer);

        marker.bindPopup(
          "<strong>" + safeText(event.title) + "</strong><br>" +
          safeText(formatDate(event.date)) + "<br>" +
          safeText(event.address) + "<br>" +
          (event.price === 0 ? "Бесплатно" : "От " + event.price + " ₽")
        );

        const card = document.createElement("article");
        card.className = "event-card";

        card.innerHTML = `
          <span class="tag">${safeText(event.category)}</span>
          <h3>${safeText(event.title)}</h3>
          <p>📅 ${safeText(formatDate(event.date))}</p>
          <p>📍 ${safeText(event.address)}</p>
          <div class="price">
            ${event.price === 0 ? "Бесплатно" : "От " + event.price + " ₽"}
          </div>
          ${event.url
            ? `<a class="ticket" href="${safeText(event.url)}"
                 target="_blank" rel="noopener noreferrer">Подробнее</a>`
            : `<p>Ссылка на билеты пока не добавлена</p>`}
        `;

        card.addEventListener("click", () => {
          map.setView(event.coords, 15);
          marker.openPopup();
        });

        eventList.appendChild(card);
      });
    }

    document.querySelectorAll("[data-category]").forEach(button => {
      button.addEventListener("click", () => {
        selectedCategory = button.dataset.category;

        document.querySelectorAll("[data-category]").forEach(b => {
          b.classList.toggle("active", b === button);
        });

        render();
      });
    });

    search.addEventListener("input", render);
    timeFilter.addEventListener("change", render);

    render();
  </script>
</body>
</html>
