<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EventMap — мероприятия Новосибирска</title>

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #20243a;
      background: #f5f6fb;
    }
    header {
      padding: 22px 5%;
      background: #fff;
      border-bottom: 1px solid #e6e8f0;
    }
    header h1 { margin: 0 0 7px; color: #6652d9; }
    header p { margin: 0; color: #687087; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 18px 5%;
      background: #fff;
    }
    input, select {
      min-width: 180px;
      flex: 1;
      padding: 12px;
      border: 1px solid #d9ddec;
      border-radius: 10px;
      font-size: 15px;
      background: white;
    }
    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 5% 18px;
      background: #fff;
    }
    .categories button {
      border: 1px solid #dedaf8;
      background: #fff;
      color: #5c4bc6;
      border-radius: 20px;
      padding: 9px 14px;
      cursor: pointer;
    }
    .categories button.active {
      background: #6652d9;
      color: white;
    }
    main {
      display: grid;
      grid-template-columns: minmax(320px, 0.95fr) minmax(350px, 1.2fr);
      gap: 20px;
      padding: 20px 5%;
    }
    #events { display: grid; gap: 14px; align-content: start; }
    .event {
      background: white;
      padding: 17px;
      border: 1px solid #e7e8f0;
      border-radius: 16px;
      box-shadow: 0 3px 12px #2222;
    }
    .tag {
      display: inline-block;
      background: #eeeaff;
      color: #5e4ac8;
      border-radius: 20px;
      padding: 5px 9px;
      font-size: 12px;
    }
    .event h2 { font-size: 19px; margin: 12px 0 8px; }
    .event p { margin: 7px 0; line-height: 1.45; color: #596176; }
    .price { font-weight: bold; color: #272b42 !important; }
    .actions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 14px; }
    .actions button, .actions a {
      display: inline-block;
      border: 0;
      border-radius: 9px;
      padding: 10px 13px;
      text-decoration: none;
      font-size: 14px;
      cursor: pointer;
    }
    .details { background: #eeeaff; color: #5e4ac8; }
    .tickets { background: #6652d9; color: white; }
    #map {
      height: calc(100vh - 185px);
      min-height: 500px;
      position: sticky;
      top: 15px;
      border-radius: 16px;
      z-index: 1;
    }
    .note {
      padding: 0 5% 22px;
      color: #72798c;
      font-size: 13px;
      line-height: 1.5;
    }
    @media (max-width: 800px) {
      main { grid-template-columns: 1fr; }
      #map { position: static; height: 400px; min-height: 350px; }
    }
  </style>
</head>

<body>
<header>
  <h1>📍 EventMap</h1>
  <p>Карта мероприятий Новосибирска — найди событие для себя</p>
</header>

<section class="toolbar">
  <input id="search" type="search"
    placeholder="Поиск по названию или месту...">
  <select id="dateFilter" aria-label="Фильтр по дате">
    <option value="all">Все даты</option>
    <option value="upcoming">Предстоящие</option>
  </select>
</section>

<nav class="categories" id="categories">
  <button class="active" data-category="Все">Все</button>
  <button data-category="Концерт">Концерты</button>
  <button data-category="Театр">Театр</button>
  <button data-category="Стендап">Стендап</button>
  <button data-category="Фестиваль">Фестивали</button>
</nav>

<main>
  <section>
    <h2>Афиша событий</h2>
    <div id="count"></div>
    <div id="events"></div>
  </section>
  <div id="map" aria-label="Карта мероприятий Новосибирска"></div>
</main>

<div class="note">
  Данные собраны из опубликованных афиш. Перед посещением проверь дату,
  время, адрес, актуальную стоимость и наличие билетов на сайте организатора.
  Метки на карте показывают площадки мероприятий.
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // Координаты площадок ориентировочные.
  // Ссылки ведут на страницы афиш, где можно проверить билеты.
  const events = [
    {

    },
    {

      price: "От 2 500 ₽",

      url: "https://live.mts.ru/novosibirsk/venues/arena/lokomotiv-arena"
    },
    {
      id: 3,
      title: "Алексей Чумаков",

      place: "Локомотив-Арена",
      address: "Ипподромская улица, 18",
      price: "От 2 500 ₽",
      lat: 55.0437, lon: 82.9430,
      url: "https://live.mts.ru/novosibirsk/venues/arena/lokomotiv-arena"
    },
    {
      id: 4,
      title: "Dead Blonde",
      category: "Концерт",
      date: "2026-11-15T18:00:00",
      place: "Лофт-парк «Подземка»",
      address: "Красный проспект, 161",
      price: "От 3 400 ₽",
      lat: 55.0604, lon: 82.9117,
      url: "https://afisha.yandex.ru/novosibirsk/concert/nov"
    },
    {
      id: 5,
      title: "Аффинаж",
      category: "Концерт",
      date: "2026-11-17T20:00:00",
      place: "Лофт-парк «Подземка»",
      address: "Красный проспект, 161",
      price: "От 2 000 ₽",
      lat: 55.0604, lon: 82.9117,

    {
      id: 6,

      url: "https://live.mts.ru/novosibirsk/collections/standup"
    },
    {
      id: 7,
      title: "Виктория Складчикова",
      category: "Стендап",
      date: "2026-11-20T19:00:00",
      place: "Локомотив-Арена",
      address: "Ипподромская улица, 18",
      price: "От 2 500 ₽",
      lat: 55.0437, lon: 82.9430,
      url: "https://live.mts.ru/novosibirsk/venues/arena/lokomotiv-arena"
    },
    {
      id: 8,
      title: "Сергей Лазарев — «Шоумен»",
      category: "Концерт",
      date: "2026-11-25T19:00:00",

      price: "От 1 900 ₽",

      url: "https://afisha.yandex.ru/novosibirsk/schedule_concert/na-noyabr/"
    },
    {
      id: 9,
      title: "Фестиваль «Дискач 90-х»",
      category: "Фестиваль",
      date: "2026-11-29T19:00:00",
      place: "Локомотив-Арена",
      address: "Ипподромская улица, 18",
      price: "От 2 200 ₽",
      lat: 55.0437, lon: 82.9430,
      url: "https://live.mts.ru/novosibirsk/venues/arena/lokomotiv-arena"
    },
    {
      id: 10,
      title: "Международный фестиваль «Книжная Сибирь»",
      category: "Фестиваль",
      date: "2026-11-20T10:00:00",
      place: "ГНТБ СО РАН",
      address: "Улица Восход, 15",
      price: "Бесплатно",
      lat: 55.0086, lon: 82.9385,
      url: "https://calendar.welcome-novosibirsk.ru/"
    }
  ];

  const map = L.map("map").setView([55.0302, 82.9204], 11);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19
  }).addTo(map);

  const markers = new Map();
  let selectedCategory = "Все";

  function formatDate(value) {
    return new Intl.DateTimeFormat("ru-RU", {
      day: "numeric",
      month: "long",
      year: "numeric",
      hour: "2-digit",
      minute: "2-digit"
    }).format(new Date(value));
  }

  function isUpcoming(event) {
    return new Date(event.date).getTime() >= Date.now();
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[char]);
  }

  function safeTicketUrl(value) {
    try {
      const url = new URL(value);
      return ["https:", "http:"].includes(url.protocol) ? url.href : "#";
    } catch {
      return "#";
    }
  }

  function showEvent(id) {
    const event = events.find(item => item.id === id);
    const marker = markers.get(id);
    if (event && marker) {
      map.setView([event.lat, event.lon], 15);
      marker.openPopup();
    }
  }

  function render() {
    const search = document.getElementById("search").value
      .trim().toLowerCase();
    const dateFilter = document.getElementById("dateFilter").value;

    const filtered = events.filter(event => {
      const text = `${event.title} ${event.place} ${event.address}`.toLowerCase();
      const matchesSearch = text.includes(search);
      const matchesCategory =
        selectedCategory === "Все" || event.category === selectedCategory;
      const matchesDate = dateFilter !== "upcoming" || isUpcoming(event);
      return matchesSearch && matchesCategory && matchesDate;
    });

    document.getElementById("count").textContent =
      `Найдено мероприятий: ${filtered.length}`;

    document.getElementById("events").innerHTML = filtered.map(event => `
      <article class="event">
        <span class="tag">${escapeHtml(event.category)}</span>
        <h2>${escapeHtml(event.title)}</h2>
        <p>📅 ${escapeHtml(formatDate(event.date))}</p>
        <p>📍 ${escapeHtml(event.place)}</p>
        <p>${escapeHtml(event.address)}</p>
        <p class="price">${escapeHtml(event.price)}</p>
        <div class="actions">
          <button class="details" onclick="showEvent(${event.id})">
            На карте
          </button>
          <a class="tickets"
             href="${escapeHtml(safeTicketUrl(event.url))}"
             target="_blank" rel="noopener noreferrer">
            Афиша и билеты ↗
          </a>
        </div>
      </article>
    `).join("");

    markers.forEach((marker, id) => {
      if (filtered.some(event => event.id === id)) {
        if (!map.hasLayer(marker)) marker.addTo(map);
      } else {
        if (map.hasLayer(marker)) map.removeLayer(marker);
      }
    });
  }

  events.forEach(event => {
    const marker = L.marker([event.lat, event.lon]).bindPopup(`
      <strong>${escapeHtml(event.title)}</strong><br>
      ${escapeHtml(formatDate(event.date))}<br>
      ${escapeHtml(event.place)}<br>
      <a href="${escapeHtml(safeTicketUrl(event.url))}"
         target="_blank" rel="noopener noreferrer">Афиша и билеты</a>
    `);
    markers.set(event.id, marker);
    marker.addTo(map);
  });

  document.getElementById("search").addEventListener("input", render);
  document.getElementById("dateFilter").addEventListener("change", render);

  document.querySelectorAll("#categories button").forEach(button => {
    button.addEventListener("click", () => {
      selectedCategory = button.dataset.category;
      document.querySelectorAll("#categories button")
        .forEach(item => item.classList.toggle("active", item === button));
      render();
    });
  });

  render();
</script>
</body>
</html>
